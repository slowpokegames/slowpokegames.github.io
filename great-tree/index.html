<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Great Tree</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: #12110a;
  color: #d4c9a8;
  font-family: Georgia, 'Times New Roman', serif;
  display: flex;
  flex-direction: column;
  height: 100vh;
  font-size: 17px;
  line-height: 1.65;
}
#title-bar {
  text-align: center;
  padding: 7px 12px;
  background: #1c1a0f;
  border-bottom: 1px solid #3a3820;
  color: #e8d87a;
  font-size: 0.82em;
  letter-spacing: 0.12em;
  flex-shrink: 0;
}
#main {
  display: flex;
  flex: 1;
  overflow: hidden;
}
#output {
  flex: 1;
  overflow-y: auto;
  padding: 18px 28px 10px;
  max-width: 820px;
  width: 100%;
  margin: 0 auto;
}
#output p { margin-bottom: 0.55em; }
.room-title { color: #e8d87a; font-weight: bold; font-size: 1.08em; margin-top: 0.5em; }
.dialog { color: #a8c8d8; font-style: italic; }
.dialog-name { color: #b8d0a4; font-weight: bold; font-style: normal; }
.err  { color: #a06050; }
.sys  { color: #6a7860; font-style: italic; }
.win  { color: #e8d87a; font-weight: bold; }
.em   { color: #d4a868; }
.sep  { color: #2e2d1a; user-select: none; }
.echo { color: #6a8858; margin-bottom: 0.15em; }

#input-wrap {
  display: flex;
  align-items: center;
  padding: 9px 28px;
  border-top: 1px solid #2e2d1a;
  background: #0d0c07;
  max-width: 820px;
  width: 100%;
  margin: 0 auto;
  flex-shrink: 0;
}
#prompt-sym { color: #6a8858; margin-right: 9px; user-select: none; }
#cmd {
  flex: 1;
  background: transparent;
  border: none;
  color: #d4c9a8;
  font-family: inherit;
  font-size: 1em;
  outline: none;
  caret-color: #7a9a6a;
}
#output::-webkit-scrollbar { width: 5px; }
#output::-webkit-scrollbar-track { background: #12110a; }
#output::-webkit-scrollbar-thumb { background: #3a3820; border-radius: 3px; }
</style>
</head>
<body>
<div id="title-bar">✦ &nbsp; THE GREAT TREE &nbsp; ✦ &nbsp; A Birthday Adventure</div>
<div id="main">
  <div id="output"></div>
</div>
<div id="input-wrap">
  <span id="prompt-sym">❯</span>
  <input id="cmd" type="text" autocomplete="off" autocorrect="off"
         autocapitalize="off" spellcheck="false" placeholder="what do you do?" />
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  THE GREAT TREE  —  a text adventure
// ═══════════════════════════════════════════════════════════════

// ── State ──────────────────────────────────────────────────────
const G = {
  playerName: '',
  room: 'high_bough',
  inv: [],
  mushrooms: 0,
  flags: {},
  frogIdx: 0,        // 0-5 across six rooms; -1 = kissed
  wizHint: 0,
  basementUnlocked: false,
  echoHeard: false,
  namePrompt: true,
  wizAggro: 0,       // 0=fine, 1=warned once, 2=warned twice, 3=newt
};

// ── Save / load ────────────────────────────────────────────────
function saveKey() { return `great-tree-v1-${G.playerName.toLowerCase()}`; }

function saveGame() {
  if (!G.playerName) return;
  try { localStorage.setItem(saveKey(), JSON.stringify({ G, MSPOT })); } catch(e) {}
}

function loadGame(name) {
  try {
    const raw = localStorage.getItem(`great-tree-v1-${name.toLowerCase()}`);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data.G || !data.MSPOT) return false;
    Object.assign(G, data.G);
    Object.assign(MSPOT, data.MSPOT);
    return true;
  } catch(e) { return false; }
}

function clearSave() {
  localStorage.removeItem(saveKey());
}

const FROG_PATH = [
  'lookout_perch', 'canopy_walk', 'mushroom_ring',
  'bower', 'cooking_grotto', 'grotto',
];

// mushroom spots keyed by room id
const MSPOT = {
  clearing: false, behind_falls: false, bark_nook: false,
  fungi_nook: false, cooking_grotto: false, blind_grotto: false,
};

const f  = k => !!G.flags[k];
const sf = k => { G.flags[k] = true; };
const has = id => G.inv.includes(id);
const add = id => { if (!has(id)) G.inv.push(id); };
const rm  = id => { G.inv = G.inv.filter(i => i !== id); };

function frogRoom() {
  return G.frogIdx >= 0 && G.frogIdx < FROG_PATH.length
    ? FROG_PATH[G.frogIdx] : null;
}

// ── Wizard hints ───────────────────────────────────────────────
const HINTS = [
  "The mermaid in the pool of falling water knows something the water has kept. Seek her before you seek anything else.",
  "The white creature in the blue nest misses a color she has not seen in some time. The bower — past the ivy curtain — holds what she has lost.",
  "Fire does not kindle itself. Old tools sleep in old places — even the prettiest ones.",
  "The fox's door is old, and old doors remember old keys. A key that smells of cold water may be exactly what you need.",
  "The beast at the bridge is not cruel — she is hungry. The Woman of the Tree can help, if her fire is lit and she has what she needs.",
  "The words on the banner are not decoration. Say them clearly, in the places that wait for them. Stone can listen.",
];

// ── Dictionary ─────────────────────────────────────────────────
const DICT_ALL = [
  ['AQUA','water'],['SILVA','forest'],['LUNA','moon'],['STELLA','star'],
  ['PORTA','door'],['VIA','road'],['PUELLA','girl'],['CANIS','dog'],
  ['ARBOR','tree'],['IGNIS','fire'],['TERRA','earth'],['VENTUS','wind'],
  ['LUMEN','light'],['UMBRA','shadow'],['FLOS','flower'],['MEL','honey'],
  ['MURUS','wall'],['PONS','bridge'],['CLAVIS','key'],['ITER','journey'],
  ['DONUM','gift'],['AMICA','friend'],['NAUTA','sailor'],['PISCIS','fish'],
  ['AVSCULTA','listen'],['AMA','love'],['DISCE','learn'],
];
const KEY_WORDS = [['AVSCULTA','listen'],['AMA','love'],['DISCE','learn']];
const FILLER = DICT_ALL.filter(w => !KEY_WORDS.some(k => k[0]===w[0]));

function readDict() {
  print("The dictionary is old and smells of pine.");
  print("");
  if (f('seenBanner')) {
    print("You flip to the pages you're looking for. Three entries seem to glow a little brighter than the rest:");
    print("");
    KEY_WORDS.forEach(([lat,eng]) =>
      print(`&nbsp;&nbsp;<span class="em">${lat}</span> &nbsp;—&nbsp; <em>${eng}</em>`));
    print("");
    print("You feel as though you already knew this, somewhere inside.");
  } else {
    print("You flip to a few pages at random:");
    print("");
    const shown = [];
    KEY_WORDS.forEach(kw => { if (Math.random() < 0.30) shown.push(kw); });
    const others = [...FILLER].sort(() => Math.random()-0.5);
    while (shown.length < 5) shown.push(others.pop());
    shown.sort(() => Math.random()-0.5);
    shown.forEach(([lat,eng]) =>
      print(`&nbsp;&nbsp;<span class="em">${lat}</span> &nbsp;—&nbsp; <em>${eng}</em>`));
    print("");
    print("You close it again. Maybe some of those will matter later.", 'sys');
  }
}

// ── Rooms ──────────────────────────────────────────────────────
// exits: { dir: 'roomId' | fn→roomId|null }
// desc: fn returning html string (paragraphs separated by \n\n)

const ROOMS = {

  // ── upstairs ─────────────────────────────────────────

  high_bough: {
    name: "The High Bough",
    desc() {
      return `You are nestled in the fork of an enormous tree — so tall that clouds drift lazily past its upper branches. Soft golden light filters through leaves the size of blankets. All around you, pale pink and violet flowers wind along the vines overhead. A second mossy nest sits on a neighboring branch nearby, still warm but empty.

Below you, the forest floor is hidden in green shadow, a very long way down. A wide branch leads <b>south</b> toward the heart of the tree. There is also a <b>closet</b> hollow in the bark beside you.`;
    },
    exits: { south:'canopy_walk', closet:'elise_closet' },
  },

  elise_closet: {
    name: "The Hollow",
    desc() {
      return `A deep hollow carved into the trunk, the bark worn silky-smooth inside. It smells of cedar and old wood.

To the <b>south</b>, back to the bough.`;
    },
    exits: { south:'high_bough', out:'high_bough', back:'high_bough' },
  },

  canopy_walk: {
    name: "The Canopy Walk",
    desc() {
      const frog = frogRoom()==='canopy_walk';
      return `A broad branch — wide as a road — stretches between the great trunks of several enormous trees. Hanging bridges of twisted vine sway in every direction.

To the <b>north</b>, the high bough where you woke. To the <b>west</b>, the oldest trunk, its bark dark and knotted. To the <b>northeast</b>, blue feathers wind around an entrance. To the <b>southeast</b>, bark carved with strange symbols. To the <b>south</b>, the sound of rushing water. To the <b>down</b>, the root-staircase winds toward the forest floor.${frog ? `\n\nA large green frog sits on a vine nearby, motionless, watching you with enormous golden eyes.` : ''}`;
    },
    exits: {
      north:'high_bough', west:'great_hollow',
      northeast:'songbird_nest', southeast:'lookout_perch',
      south:'grotto', down:'root_chamber', closet:'bark_nook', east:'bark_nook',
    },
  },

  grotto: {
    name: "The Grotto",
    desc() {
      const talked = f('mermaidTalked');
      const finalFrog = frogRoom()==='grotto';
      return `A hollow of living root and stone, cool and full of mist. A waterfall drops from somewhere far above into a pool of perfect blue-green water. Tiny silver fish dart beneath the surface.

${talked
  ? `The mermaid has slipped away — or perhaps she is behind the falls again.`
  : `A mermaid sits on a root at the water's edge, dark-haired, humming softly to herself. She looks up when she sees you and brightens.`}

The waterfall roars. Behind its curtain, the darkness seems to go back further than it should. You could try going <b>behind</b> the falls.

To the <b>north</b>, the canopy walk.${finalFrog && !f('frogKissed') ? `\n\nA large green frog floats on a lily pad at the edge of the pool, watching you with golden eyes. He doesn't leap this time. He simply waits.` : ''}`;
    },
    exits: {
      north:'canopy_walk',
      behind:'behind_falls', further:'behind_falls', west:'behind_falls',
    },
  },

  behind_falls: {
    name: "Behind the Waterfall",
    desc() {
      const keyGone = has('iron_key') || f('keyTaken');
      const mushroomGone = MSPOT.behind_falls;
      return `The water crashes deafeningly on either side of you, but you stay dry. A narrow ledge leads back into the rock, lit by blue-green light through the curtain of water.

${keyGone
  ? `The crack in the stone where the key rested is empty now.`
  : `Wedged into a crack in the stone, wrapped in a leaf tied with root-fiber: a <span class="em">small iron key</span>, old and green with age.`}
${!mushroomGone ? `\nA <span class="em">mushroom</span> grows on the damp ledge, glowing faintly blue.` : ''}

To the <b>east</b>, back through the waterfall.`;
    },
    exits: { east:'grotto', out:'grotto', back:'grotto' },
  },

  great_hollow: {
    name: "The Great Hollow",
    desc() {
      return `Inside the oldest trunk in the forest, a vast chamber has grown warm and golden over centuries. Hundreds of tiny sleeping faces are carved into the walls — humans, foxes, owls, mice — all dreaming. The floor is deep, soft moss.

To the <b>east</b>, the canopy walk. To the <b>northwest</b>, a root-arch leads to a quieter chamber. To the <b>southwest</b>, vines part like curtains over a high opening.`;
    },
    exits: { east:'canopy_walk', northwest:'mossy_chamber', southwest:'overlook' },
  },

  mossy_chamber: {
    name: "The Mossy Chamber",
    desc() {
      return `A small, still room where everything is covered in velvet-soft green moss. A dark pool in the floor reflects your face back — perhaps a little too perfectly.

To the <b>southeast</b>, the great hollow.`;
    },
    exits: { southeast:'great_hollow' },
  },

  overlook: {
    name: "The Overlook",
    desc() {
      return `A platform of ancient bark juts out to the southwest, giving a wide view of the deep forest below. Bark-scrolls covered in cramped, looping writing hang from every branch. Crystals dangle on strings, throwing tiny rainbows across the floor. Dried flowers, interesting stones, and small carved figures are arranged with great care and no obvious logic.

An old wizard sits cross-legged in the middle of it all, eyes half-closed, wearing robes the color of a sunset after rain. A long silver braid falls over one shoulder. He smells of pine and something sweeter.

A thick <span class="em">dictionary</span> lies open on a root-shelf nearby.

To the <b>northeast</b>, the great hollow.`;
    },
    exits: { northeast:'great_hollow' },
  },

  songbird_nest: {
    name: "The Songbird Nest",
    desc() {
      const gifted = f('unicornGifted');
      return `A hollow where everything is blue. Blue feathers line the walls in careful rows. Blue river stones spiral across the floor. Blue flowers — the tiny kind that smell of honey — wind up the entrance arch. Wind chimes of blue-dyed wood sing softly at the entrance.

A unicorn stands at the center, pure white, her horn like twisted morning frost, her eyes a calm, patient blue.

${gifted
  ? `She dips her head gracefully when she sees you.`
  : `At her hooves, almost hidden by the moss, lies a single blue flower — pressed flat and dried, kept long past its time, as if she has held onto it through a very long winter.\n\nShe watches you. She waits.`}

To the <b>southwest</b>, the canopy walk.`;
    },
    exits: { southwest:'canopy_walk', south:'canopy_walk' },
  },

  lookout_perch: {
    name: "The Lookout Perch",
    desc() {
      const frogHere = frogRoom()==='lookout_perch';
      return `A branch that juts boldly outward, open to the sky on three sides. The view to the south is remarkable — straight down to a walled garden, and rising from its center, the broken towers of an ancient fortress. Something glints at the very top.

A carved wooden <span class="em">telescope</span> leans against the trunk.${frogHere ? `\n\nA large green frog sits perfectly still at the very tip of the branch, staring south with enormous golden eyes. He seems completely unbothered by the height.` : ''}

To the <b>northwest</b>, the canopy walk.`;
    },
    exits: { northwest:'canopy_walk', north:'canopy_walk' },
  },

  bark_nook: {
    name: "The Bark Nook",
    desc() {
      return `A small hollow just off the canopy walk. It smells of old leaves and mystery.${!MSPOT.bark_nook ? `\n\nNestled in the corner: a small <span class="em">mushroom</span>, deep purple and very quiet.` : ''}

To the <b>west</b>, the canopy walk.`;
    },
    exits: { west:'canopy_walk', out:'canopy_walk' },
  },

  // ── downstairs ────────────────────────────────────────

  root_chamber: {
    name: "The Root Chamber",
    desc() {
      return `At the base of the great tree, enormous roots arch up around you like the fingers of a buried giant, forming a high vaulted chamber. Light filters down from the canopy far above.

To the <b>north</b>, a grand arch of pale bark opens to a sunlit clearing. To the <b>east</b>, flowers spill from a leafy curtain. To the <b>west</b>, a circle of glowing mushrooms pulses softly. To the <b>south</b>, the earth gives way to a warm, dark burrow. To the <b>up</b>, the root-staircase winds back toward the canopy.`;
    },
    exits: { up:'canopy_walk', north:'clearing', east:'bower', west:'mushroom_ring', south:'fox_warren' },
  },

  clearing: {
    name: "The Clearing",
    desc() {
      return `A sunlit open space before the great tree. The forest watches from all sides. To the <b>north</b>, a path winds between the pines toward a road — and who knows what else. To the <b>south</b>, the great bark arch leads back inside.${!MSPOT.clearing ? `\n\nHalf-hidden at the base of the bark arch, nestled in the roots: a small <span class="em">mushroom</span>, deep red with white spots.` : ''}`;
    },
    exits: { south:'root_chamber', north:'road' },
  },

  road: {
    name: "The Road",
    desc() { return ``; },
    exits: { south:'clearing' },
    onEnter() {
      print("The path leads out of the clearing and into the trees, winding away into distance. You can almost hear voices — friends, adventures not yet begun.");
      print("But the forest calls you back. <em>Today is not that day.</em>", 'sys');
      G.room = 'clearing';
      print("");
      printRoom();
    },
  },

  bower: {
    name: "The Bower",
    desc() {
      const frogHere = frogRoom()==='bower';
      return `Past a curtain of hanging ivy, the roots have grown into shelves and curved seats padded with fine moss. Pressed flowers cover every wall. Beautiful things sit on the shelves: a crystal acorn, a golden leaf, a glass bottle with a tiny ship inside it, and a small <span class="em">ceramic bunny</span>, glazed white, sitting very upright with its paws folded.

It is heavier than it looks.${!f('flowerTaken') ? `\n\nA cluster of small <span class="em">blue flowers</span> grows from a crack in the root-wall, fragrant and bright.` : ''}${frogHere ? `\n\nA large green frog crouches half-hidden under a golden leaf on the lowest shelf, very still.` : ''}

To the <b>west</b>, the root chamber.`;
    },
    exits: { west:'root_chamber', out:'root_chamber' },
  },

  mushroom_ring: {
    name: "The Mushroom Ring",
    desc() {
      const frogHere = frogRoom()==='mushroom_ring';
      return `A perfect circle of enormous mushrooms, each glowing a different color — amber, violet, sea-green, rose. In the center, a flat stone serves as a table, set with acorn-cap bowls and leaf-plates as though a feast just ended.${frogHere ? `\n\nA large green frog sits on the amber mushroom, perfectly still, staring at nothing in particular.` : ''}

To the <b>east</b>, the root chamber. To the <b>south</b>, between the two tallest mushrooms, the warm smell of cooking drifts up.`;
    },
    exits: { east:'root_chamber', south:'cooking_grotto' },
  },

  fox_warren: {
    name: "The Fox Warren",
    desc() {
      const unlocked = f('keyUsed');
      return `The earth here is soft and warm, and the roots overhead make a low, cozy ceiling. Fox-prints cover the floor in every direction. It smells of dry leaves and autumn and something just slightly wild.

To the <b>north</b>, the root chamber. To the <b>west</b>, a narrow root-tunnel leads further in. To the <b>south</b>, a heavy wooden door stands iron-banded${unlocked ? `, open now, letting in garden-scented air.` : `. The keyhole is old and green with age.`}`;
    },
    exits: {
      north:'root_chamber', west:'root_tunnel',
      south() {
        if (!f('keyUsed')) { print("The door is locked. The keyhole is old and green with age.", 'err'); return null; }
        return 'old_garden';
      },
    },
  },

  root_tunnel: {
    name: "The Root Tunnel",
    desc() {
      return `A low tunnel where roots twist overhead. The air smells of damp earth and, faintly, something cooking. To the <b>south</b>, a tiny side-chamber glows with soft colored light. To the <b>north</b>, the roots part around a dark opening that drops away into deep earth. To the <b>east</b>, the fox warren. To the <b>west</b>, the cooking grotto.`;
    },
    exits: { east:'fox_warren', west:'cooking_grotto', south:'fungi_nook', north:'cave_down' },
  },

  fungi_nook: {
    name: "The Fungi Nook",
    desc() {
      return `A tiny chamber whose walls are covered in bioluminescent mushrooms — dozens of them, in every shade of blue, green, gold, and pink, pulsing gently like slow breathing.${!MSPOT.fungi_nook ? `\n\nOne mushroom near the floor is different — smaller, brighter, clearly <span class="em">pickable</span>.` : ''}

To the <b>north</b>, the root tunnel.`;
    },
    exits: { north:'root_tunnel', out:'root_tunnel' },
  },

  cooking_grotto: {
    name: "The Cooking Grotto",
    desc() {
      const frogHere = frogRoom()==='cooking_grotto';
      const fire = f('hearthLit');
      return `A cave of smooth stone and living roots. ${fire ? `A warm fire burns in a hollow log, sending sparks spiraling up through a hole in the ceiling.` : `A hollow log sits cold in the center — a fireplace waiting for flame.`} Clay pots and bunches of dried herbs hang from root-hooks. It smells of woodsmoke and blackberries and something harder to name.

The Woman of the Tree stands at the stone hearth, stirring a pot with a long wooden spoon. She is beautiful in the way that old trees are beautiful — warm and steady, with kind eyes that catch the firelight. When she looks up at you, the whole room feels a little more like home.${frogHere ? `\n\nA large green frog sits on the hearthstone, watching the ${fire ? 'fire' : 'cold log'} with great interest.` : ''}${!MSPOT.cooking_grotto ? `\n\nUnder a clay pot on a low shelf: a <span class="em">mushroom</span>, golden-yellow and plump.` : ''}

To the <b>north</b>, the mushroom ring. To the <b>east</b>, the root tunnel. To the <b>west</b>, something rushes and gurgles. A passage <b>out</b> rises toward daylight.`;
    },
    exits: { north:'mushroom_ring', out:'cave_mouth', east:'root_tunnel', west:'stream_cave' },
  },

  stream_cave: {
    name: "The Stream Cave",
    desc() {
      return `An underground stream cuts through this cave fast and cold, churning white over smooth stones. The mist is chilly. Stepping stones cross the water — they wobble.

To the <b>east</b>, the cooking grotto.`;
    },
    exits: { east:'cooking_grotto', out:'cooking_grotto' },
  },

  cave_mouth: {
    name: "The Cave Mouth",
    desc() {
      const torchGone = has('torch') || has('torch_lit') || f('torchTaken');
      return `A broad, low cave. Two great archways open to the <b>north</b> letting in pale daylight and the smell of pine. Animal tracks cross the dusty floor.${!torchGone ? `\n\nLeaning against the wall near the left arch, wrapped in a protective leaf: a <span class="em">torch</span>, unlit, smelling of pine resin.` : ''}

To the <b>south</b>, the cooking grotto.`;
    },
    exits: { south:'cooking_grotto', north:'clearing', out:'clearing' },
  },

  // ── outdoors ──────────────────────────────────────────

  old_garden: {
    name: "The Old Garden",
    desc() {
      return `Stone walls — more moss than stone now — surround a wild tangle of overgrown flowers, brambles, and ancient fruit trees. The only door is the one you came through, iron-banded, behind you to the <b>north</b>.

In the corner, an oak tree older than the wall grows through it, its bark split into a hollow just big enough to reach into. A soft golden light glows inside, and the smell of honey is unmistakable.${f('honeyTaken') ? `` : ` The hollow holds something <span class="em">golden</span>.`}

At the garden's center, half-drowned in ivy, fortress towers rise. Something glints at the very top. The walls are sheer from here — there must be another way in.`;
    },
    exits: { north:'fox_warren' },
  },

  ravine: {
    name: "The Ravine",
    desc() {
      const calm = f('sunnyCalmed');
      return `A narrow passage between the great tree and the garden wall. Far below, the rocks are dark and jagged.

A suspension bridge of old rope and wooden planks climbs steeply toward the fortress wall. ${calm
  ? `A yellow dog with a curly tail lies contentedly at the bridge's foot, tail over her nose, letting you pass freely.`
  : `Sitting at the foot of the bridge is a yellow dog with a tightly curled tail and amber eyes. She is roughly the size of a small sofa. She is not growling. She does not need to. She is simply <em>there</em> — immovable as geology — watching you with patient certainty.`}

A dark cave mouth opens at the base of the ravine to the <b>east</b>. To the <b>north</b>, a path leads around to the clearing.${calm ? `\n\nThe bridge is clear. You may go <b>up</b> or <b>cross</b> it.` : ''}`;
    },
    exits: {
      north:'clearing', east:'east_cave_mouth', cave:'east_cave_mouth',
      up() {
        if (!f('sunnyCalmed')) { print("Sunny doesn't move. She is immovable as geology.", 'err'); return null; }
        return 'fortress_ground';
      },
      cross() {
        if (!f('sunnyCalmed')) { print("Sunny is blocking the bridge. She is not moving.", 'err'); return null; }
        return 'fortress_ground';
      },
      bridge() {
        if (!f('sunnyCalmed')) { print("Sunny is blocking the bridge. She is not moving.", 'err'); return null; }

function talkTo(name) {
  const n = name.toLowerCase().replace(/^(the|a|an)\s+/, '');

  // bunny (not an NPC, but people try)
  if (['bunny','rabbit','ceramic'].some(k => n.includes(k))) {
    if (G.room !== 'bower') { print(`The bunny isn't here. And even if it were — it's ceramic.`, 'sys'); return; }
    print(`You attempt a conversation with the ceramic bunny.`);
    print(`It listens very attentively. It has excellent posture. It does not reply.`);
    print(`You get the distinct impression it has heard everything and judged nothing.`);
    return;
  }

  // mermaid
  if (['mermaid','her','woman in pool'].some(k => n.includes(k))) {
    // 'her' in cooking_grotto means the Woman of the Tree, not the mermaid
    if (G.room === 'cooking_grotto' && !n.includes('mermaid')) { talkTo('woman'); return; }
    if (G.room !== 'grotto') { print("She's not here.", 'err'); return; }
    if (f('crownWorn') && has('tiny_crown')) {
      print(`The mermaid surfaces, notices the crown on your finger, and immediately dips her head beneath the water in a small, elegant bow.`);
      print(`<span class="dialog">"Your Highness."</span>`, 'dialog');
      print(`She resurfaces looking delighted with this development.`);
    }
    if (f('mermaidTalked')) {
      print(`The mermaid surfaces for a moment and smiles.`);
      print(`<span class="dialog">"Still looking? Remember — behind the falls. You won't melt."</span>`, 'dialog');
      print(`She winks and dives back under.`);
    } else {
      sf('mermaidTalked');
      print(`The mermaid looks up and brightens.`);
      print(`<span class="dialog">"Oh! You're awake at last. Listen — do you see the waterfall? Most people just see the water. But if you look at where it meets the rock... there is a space behind it. I found something there once. Something old and important. A key."</span>`, 'dialog');
      print(`She glances toward the curtain of falling water, then back at you with a small, knowing smile.`);
      print(`<span class="dialog">"The water's cold, but you won't melt."</span>`, 'dialog');
      print(`And with that she slips beneath the surface and is gone.`);
    }
    return;
  }

  // wizard
  if (['wizard','old wizard'].some(k => n.includes(k)) || n === 'man' || n === 'him' || n === 'he') {
    if (G.room !== 'overlook') { print("He's not here.", 'err'); return; }
    if (f('crownWorn') && has('tiny_crown')) {
      print(`The wizard opens both eyes — unusual, for him. He looks at the crown on your finger for a long moment.`);
      print(`<span class="dialog">"A frog king's crown. Well, well. Your Majesty."</span>`, 'dialog');
      print(`He closes his eyes again, with the faintest possible smile.`);
    }
    if (has('gold_coin') && !f('mapGiven')) {
      print(`The wizard opens one eye. It lingers on your pocket for a moment.`);
      print(`<span class="dialog">"Gold. I can smell it from here — old gold, at that. Gold remembers where it has been."</span>`, 'dialog');
      print(`He closes his eye again.`);
      print(`<span class="dialog">"If you were to give it to me, I might give you something more useful in return."</span>`, 'dialog');
    } else if (G.mushrooms > 0) {
      print(`The wizard opens one eye and breathes in slowly through his nose.`);
      print(`<span class="dialog">"Mmm. I smell something earthy on you. Something from the forest floor... a mushroom, unless I'm mistaken."</span>`, 'dialog');
      print(`He opens the other eye.`);
      print(`<span class="dialog">"I trade thoughts for mushrooms, you know. If you were feeling generous — just give one to me, and I'll tell you something worth knowing."</span>`, 'dialog');
      print(`He closes his eyes again, smiling faintly.`);
    } else {
      print(`The wizard opens one eye.`);
      print(`<span class="dialog">"I know a great many things. I will share them freely — but wisdom, little one, is not free. Bring me a mushroom from the forest and I will tell you what I know. Or bring me gold, and I will give you something more."</span>`, 'dialog');
      print(`He closes his eyes. A slow curl of smoke rises from nowhere.`);
    }
    return;
  }

  // Woman of the Tree
  if (['woman','cook','her','lady','mom','mother','tree'].some(k => n.includes(k))) {
    if (G.room !== 'cooking_grotto') { print("She's not here.", 'err'); return; }
    if (f('crownWorn') && has('tiny_crown')) {
      print(`She turns from the pot, catches sight of the crown on your finger, and puts both hands on her hips.`);
      print(`<span class="dialog">"Your Royal Highness! In my kitchen! Well, that changes everything — sit down, sit down."</span>`, 'dialog');
      print(`She is clearly having a wonderful time.`);
    }
    if (f('treatGiven')) {
      print(`<span class="dialog">"The treat's already made, love. I hope it worked!"</span>`, 'dialog');
      print(`She smiles and goes back to her pot.`);
    } else if (f('momHasHoney') && f('hearthLit')) {
      // give treat
      print(`<span class="dialog">"Almost ready — just a moment..."</span>`, 'dialog');
      print(`She stirs the pot once, twice, then ladles something green and good-smelling onto a leaf.`);
      print(`<span class="dialog">"For the dog. She can't resist this. Just be gentle with her, alright?"</span>`, 'dialog');
      add('green_treat');
      sf('treatGiven');
      print(`You receive: <span class="em">a green treat</span>.`);
    } else if (f('momHasHoney') && !f('hearthLit')) {
      print(`<span class="dialog">"I have the honey, but the fire is out. Could you light it for me? I cannot make anything without a flame."</span>`, 'dialog');
      print(`She gestures at the cold hollow log.`);
    } else if (f('hearthLit') && !f('momHasHoney')) {
      print(`<span class="dialog">"The fire is going — lovely! But I am missing something golden and sweet. From a tree, perhaps?"</span>`, 'dialog');
    } else {
      print(`She looks up and smiles — the best kind of smile.`);
      print(`<span class="dialog">"There you are! I would make you something very special — something green and very good — but I need honey, and my fire is out."</span>`, 'dialog');
      print(`She glances at the cold hollow log.`);
    }
    return;
  }

  // unicorn
  if (['unicorn','white','horse'].some(k => n.includes(k))) {
    if (G.room !== 'songbird_nest') { print("The unicorn isn't here.", 'err'); return; }
    if (f('crownWorn') && has('tiny_crown')) {
      print(`The unicorn sees the crown on your finger. She dips her horn — a slow, deliberate bow. Then she raises her head and looks at you as if this is exactly what she expected all along.`);
    } else {
      print(`The unicorn regards you with calm blue eyes. She does not speak. She waits.`);
    }
    if (!f('unicornGifted')) print(`At her hooves, the dried blue flower catches your eye.`);
    return;
  }

  // frog
  if (['frog','toad'].some(k => n.includes(k))) {
    const frogLoc = frogRoom();
    if (frogLoc !== G.room) { print("There is no frog here.", 'err'); return; }
    if (f('frogKissed')) { print(`The pool is still. Wherever the prince went, it was with a magnificent splash.`, 'sys'); return; }
    if (f('crownWorn') && has('tiny_crown') && G.frogIdx === FROG_PATH.length - 1) {
      print(`The frog on the lily pad goes completely still.`);
      print(`His golden eyes fix on the crown on your finger.`);
      print(`Very slowly, he blinks.`);
      print(`<span class="dialog">"..."</span>`, 'dialog');
      print(`You get the feeling he recognizes it.`);
      return;
    }
    if (G.frogIdx < FROG_PATH.length - 1) {
      G.frogIdx++;
      print(`The frog blinks once — slowly, deliberately — and launches off in a tremendous leap, vanishing before you can so much as say hello.`);
      print(`You have a feeling you will find him again somewhere.`, 'sys');
    } else {
      print(`The frog on the lily pad holds very still.`);
      print(`Something in the way he looks at you suggests he has been waiting a very long time.`);
    }
    return;
  }

  // sunny / dog
  if (['sunny','dog','beast','animal'].some(k => n.includes(k))) {
    if (G.room !== 'ravine') { print("She's not here.", 'err'); return; }
    if (f('crownWorn') && has('tiny_crown') && f('sunnyCalmed')) {
      print(`Sunny opens both amber eyes, sniffs your finger with great interest, and gives the crown a careful lick.`);
      print(`She appears to find it not edible. She is briefly disappointed. Then she thumps her tail and settles back down.`);
      return;
    }
    if (f('sunnyCalmed')) {
      print(`Sunny opens one amber eye, thumps her curly tail twice, and closes it again.`);
    } else {
      print(`Sunny fixes you with a look of ancient, patient certainty. She does not growl. She does not need to.`);
      print(`You get the sense that conversation is not really on the table right now.`);
    }
    return;
  }

  print(`You don't see anyone by that name here.`, 'err');
}

// ── Commands ───────────────────────────────────────────────────

function cmdGo(dir) {
  const room = ROOMS[G.room];
  if (!room) return;
  const exitVal = room.exits && room.exits[dir];
  if (exitVal === undefined) {
    // try partial match
    const keys = Object.keys(room.exits || {});
    const match = keys.find(k => k.startsWith(dir) || dir.startsWith(k));
    if (match) { cmdGo(match); return; }
    print("You can't go that way.", 'err'); return;
  }
  const dest = typeof exitVal === 'function' ? exitVal() : exitVal;
  if (!dest) return; // blocked — exit fn already printed message
  if (!ROOMS[dest]) { print(`(missing room: ${dest})`, 'err'); return; }
  G.room = dest;
  const destRoom = ROOMS[dest];
  if (destRoom.onEnter) { destRoom.onEnter(); return; } // onEnter controls output for special rooms
  printRoom();
}

    'honey':'honey','pot':'honey','clay pot':'honey','honey pot':'honey',
    'treat':'green_treat','green treat':'green_treat','dog treat':'green_treat',
    'crown':'tiny_crown','golden crown':'tiny_crown','little crown':'tiny_crown',
    'mushroom':'mushroom',
  };
  const id = aliases[t] || aliases[t.replace(/^(my|the|a|an)\s+/,'')];
  if (!id) return null;
  if (id === 'torch_lit') return has('torch_lit') ? 'torch_lit' : has('torch') ? 'torch' : null;
  if (id === 'mushroom') return G.mushrooms > 0 ? 'mushroom' : null;
  return has(id) ? id : null;
}

function cmdLook(target) {
  if (!target) { printRoom(); return; }
  const t = target.toLowerCase()
    .replace(/^(at|the|a|an|my|this|that)\s+/g, '')
    .replace(/\s+(carefully|closely|again)$/, '')
    .trim();

  // "look around" → full room description
  if (!t || t === 'around' || t === 'about' || t === 'room' || t === 'here') {
    printRoom(); return;
  }

  // Hollow tree in old_garden — check before NPC lookup so 'tree' doesn't drift to 'Woman of the Tree'
  if (t.includes('tree') && G.room === 'old_garden') {
    if (f('honeyTaken')) { print(`The hollow is empty now, the golden glow gone.`); }
    else { print(`A hollow in the old oak, just big enough to reach into. Inside: a small clay pot sealed with a leaf, filled with honey — warm and heavy and golden. The smell is wonderful.`); }
    return;
  }

  // NPC examination
  const npcTarget = resolveNPC(t);
  if (npcTarget) {
    const npcRoomMap = { mermaid:'grotto', wizard:'overlook', unicorn:'songbird_nest', sunny:'ravine', woman:'cooking_grotto' };
    const here = npcRoomMap[npcTarget] === G.room || (npcTarget === 'frog' && frogRoom() === G.room);
    if (here) {
      const desc = NPC_DESC[npcTarget];

      print(`The frog became a prince and leaped back into the pool. Only ripples remain.`, 'sys');

      print(`${names[npcTarget] || 'They'} isn't here right now.`, 'sys');

    return;
  }

  // Carried item examination
  const carriedId = resolveCarriedItem(t);

      print(ITEM_DESC.blue_flower);

  if (['door','gate','lock','latch'].some(k => t.includes(k)) && G.room === 'fox_warren') {
    if (f('keyUsed')) { print(`The heavy iron-banded door stands open, releasing garden-scented air.`); }
    else { print(`A heavy wooden door, iron-banded, set into the earth. The keyhole is old and green with age — about the size of a small iron key.`); }
    return;
  }

  // Fire / hearth in kitchen
  if (['fire','hearth','log','flame','fireplace'].some(k => t.includes(k)) && G.room === 'cooking_grotto') {
    if (f('hearthLit')) { print(`The fire burns warmly in the hollow log, sending sparks spiraling up.`); }
    else { print(`A hollow log, cold and dark — a fireplace waiting for flame.`); }
    return;
  }

  if (['sky','stars','sun','moon','clouds','view','outside','below','down'].some(k => t.includes(k))) {
    if (G.room === 'high_bough' || G.room === 'lookout_perch' || G.room === 'overlook' || G.room === 'tower_top') {
      print(`The forest stretches in every direction — green and deep and old. The sky above is enormous.`);
    } else { print(`You'd need to be somewhere higher to see that.`, 'sys'); }
    return;
  }

  // Mushroom (in room, not carried)
  if (['mushroom','shroom','fungus'].some(k => t.includes(k))) {
    if (MSPOT[G.room] === false) { print(`A mushroom, glowing faintly. It can be picked.`); }
    else if (G.room === 'mushroom_ring') { print(`Enormous mushrooms, each glowing a different color. They are not pickable — too big, and somehow not meant for pockets.`); }
    else { print(`You don't see a mushroom here right now.`, 'sys'); }
    return;
  }

  // Torch (in room, not carried)
  if (t.includes('torch') && G.room === 'cave_mouth' && !f('torchTaken')) {

  }

  // Generic fall-through — friendly, not an error
  print(`You look carefully, but the ${t} doesn't reveal anything more.`, 'sys');
}

function cmdTake(target) {
  if (!target) { print("Take what?", 'err'); return; }
  const t = target.toLowerCase().replace(/^(the|a|an)\s+/, '');

  // Bower decorative items — beautiful but not yours to take
  if (G.room === 'bower' && ['acorn','crystal acorn','golden leaf','gold leaf','leaf','bottle','ship','tiny ship'].some(k => t.includes(k))) {
    print(`It's beautiful, but it feels like it belongs here. You leave it where it is.`, 'sys'); return;
  }

  // Bunny → redirect to open
  if (['bunny','ceramic','rabbit'].some(k => t.includes(k))) {
    if (G.room !== 'bower') { print(`There's no bunny here.`, 'sys'); return; }
    print(`The bunny is solid and heavy. But it has a seam around the middle — maybe it opens.`, 'sys'); return;
  }

  // Flint and steel from open bunny
  if (['flint','steel','flint and steel'].some(k => t.includes(k))) {
    if (has('flint_steel')) { print(`You already have the flint and steel.`, 'sys'); return; }
    if (G.room !== 'bower' || !f('bunnyOpen')) { print(`There's no flint and steel here.`, 'sys'); return; }
    sf('flintTaken'); add('flint_steel');
    print(`You take the flint and steel from the open bunny.`); return;
  }

  // Gold coin
  if (['coin','gold coin','gold'].some(k => t.includes(k))) {
    if (has('gold_coin')) { print(`You already have the gold coin.`, 'sys'); return; }
    print(`There's no coin here to take.`, 'sys'); return;
  }

  // Overlook — wizard's possessions
  if (G.room === 'overlook') {
    if (['dictionary','book'].some(k => t.includes(k))) {
      print(`You try to lift the dictionary. It doesn't move. It is extraordinarily heavy — heavier than a book has any right to be. Perhaps some things are meant to stay where they are.`, 'sys'); return;
    }
    if (['scroll','scrolls','stone','stones','rock','figure','figures','carving','dried flower','dried flowers','crystal','crystals'].some(k => t.includes(k))) {
      aggravateWizard(); return;
    }
  }

  if (['mushroom','shroom','fungus'].some(k => t.includes(k))) {
    if (G.room === 'mushroom_ring') {
      print(`The mushrooms are enormous and rooted deep — you couldn't dislodge one if you tried.`, 'sys'); return;
    }
    if (MSPOT[G.room] === false) {
      MSPOT[G.room] = true;
      G.mushrooms++;
      print(`You pick the mushroom carefully. It goes into your pocket. (${G.mushrooms} mushroom${G.mushrooms!==1?'s':''})`);
    } else { print(`There's no mushroom to take here.`, 'err'); }
    return;
  }

  if (['iron key','key','old key'].some(k => t.includes(k))) {
    if (G.room !== 'behind_falls') { print("There's no key here.", 'err'); return; }
    if (f('keyTaken')) { print("You already have the key.", 'err'); return; }
    sf('keyTaken'); add('iron_key');
    print(`You unwrap the leaf and take the iron key. It is cold, slightly green, and feels important.`);
    return;
  }

  if (['torch'].some(k => t.includes(k))) {
    if (G.room !== 'cave_mouth') { print("There's no torch here.", 'err'); return; }
    if (has('torch') || has('torch_lit') || f('torchTaken')) { print("You already have the torch.", 'err'); return; }
    sf('torchTaken'); add('torch');
    print(`You unwrap the protective leaf and take the torch. It smells of pine resin, ready to be lit.`);
    return;
  }

  if (['blue flower','flower','flowers','bloom','blossom'].some(k => t.includes(k))) {
    if (has('blue_flower')) { print(`You already have the blue flowers.`, 'sys'); return; }
    if (G.room === 'overlook') { aggravateWizard(); return; }
    if (G.room === 'songbird_nest') {
      print(`The flower at her hooves is pressed flat and dry — it has belonged to her a long time. Taking it would feel wrong.`);
      print(`But you could bring her a fresh one. Blue flowers grow in the bower, just east of the great root chamber.`, 'sys');
      return;
    }
    if (G.room !== 'bower') {
      print(`There are no blue flowers here to take. They grow in the bower — past the ivy curtain east of the root chamber.`, 'sys'); return;
    }
    if (f('flowerTaken')) { print(`You already picked those flowers.`, 'sys'); return; }
    sf('flowerTaken'); add('blue_flower');
    print(`You pick the cluster of blue flowers from the root-crack. They smell of honey.`);
    return;
  }

  if (['honey','pot','honey pot','clay pot'].some(k => t.includes(k))) {
    if (G.room !== 'old_garden') { print("There's no honey here.", 'err'); return; }
    if (f('honeyTaken')) { print("The hollow is already empty.", 'err'); return; }
    sf('honeyTaken'); add('honey');
    print(`You reach into the hollow and pull out a small clay pot sealed with a leaf. Warm, heavy, and golden. The smell is remarkable.`);
    return;
  }

  if (['treat','green treat','green'].some(k => t.includes(k))) {
    if (has('green_treat')) { print("You already have the treat.", 'sys'); return; }
    if (!f('treatGiven')) { print("You don't have a treat yet.", 'sys'); return; }
    print("The treat is already in your pocket.", 'sys'); return;
  }

  if (['present','gift','box','package'].some(k => t.includes(k))) {
    if (G.room !== 'tower_top') { print("There's no present here.", 'err'); return; }
    print(`You pick it up. Your name is on the label, written in careful letters.`);
    print(`It is lighter than you expected, and heavier. Both at once.`);
    return;
  }

  // Check if it might be a takeable item in a wrong room — give hints
  if (!target) { print(`Take what?`, 'sys'); return; }
  if (t.includes('key') && G.room !== 'behind_falls') {
    print(`There's no key here. ${f('keyTaken') ? 'You already have it.' : 'It may be behind the waterfall in the grotto.'}`, 'sys'); return;
  }
  if (t.includes('torch') && G.room !== 'cave_mouth') {
    print(`There's no torch here. ${f('torchTaken') ? 'You already have it.' : 'There may be one in the cave mouth to the north of the cooking grotto.'}`, 'sys'); return;
  }
  if (t.includes('honey') && G.room !== 'old_garden') {
    print(`There's no honey here. ${f('honeyTaken') ? 'You already have it.' : 'There may be some in the old garden, south of the fox warren.'}`, 'sys'); return;
  }
  const npcTarget = resolveNPC(t);
  if (npcTarget) {
    const responses = {
      wizard:  `The wizard opens one eye. You decide this was never a serious plan.`,
      mermaid: `You reach toward the pool. The mermaid raises an eyebrow. You withdraw your hands.`,
      unicorn: `The unicorn takes a small step back. You immediately feel embarrassed.`,
      frog:    `The frog blinks at you. You have second thoughts.`,
      sunny:   `Sunny fixes you with a look. A very specific look. You reconsider.`,
      woman:   `She gives you a look that only a mother can give. You put your hands in your pockets.`,
    };
    print(responses[npcTarget] || `That would be quite rude.`, 'sys'); return;
  }
  print(`You don't see anything like that to take here.`, 'sys');
}

// Resolve any string to a canonical exit key
function resolveDir(str) {
  if (!str) return null;
  const s = str.toLowerCase().trim();
  const map = {
    // full direction words
    north:'north', south:'south', east:'east', west:'west',
    up:'up', down:'down',
    northeast:'northeast', northwest:'northwest',
    southeast:'southeast', southwest:'southwest',
    // abbreviations
    n:'north', s:'south', e:'east', w:'west', u:'up', d:'down',
    ne:'northeast', nw:'northwest', se:'southeast', sw:'southwest',
    // natural synonyms
    upstairs:'up', downstairs:'down', above:'up', below:'down',
    outside:'out', out:'out', back:'back', behind:'behind',
    further:'further', forward:'forward', ahead:'forward',
    in:'in', inside:'in', through:'through',
    closet:'closet', bridge:'bridge', cross:'cross', cave:'cave',
    // waterfall phrases (map to 'behind' exit)
    waterfall:'behind', falls:'behind',
    'behind waterfall':'behind', 'behind the waterfall':'behind',
    'behind falls':'behind', 'behind the falls':'behind',
    'through waterfall':'behind', 'through the waterfall':'behind',
    'through falls':'behind', 'through the falls':'behind',
    'into waterfall':'behind', 'past the waterfall':'behind',
    // basement fast travel
    fast:'fast travel', 'fast travel':'fast travel',
  };
  // direct match
  if (map[s] !== undefined) return map[s];
  // strip leading prepositions and try again
  const stripped = s.replace(/^(to|into|toward|towards|through|over|across|past|via|up|down|the)\s+/g,'').trim();
  if (map[stripped] !== undefined) return map[stripped];
  return null;
}

// Resolve any string to a canonical NPC key
const NPC_MAP = {
  mermaid: ['mermaid','swimmer','woman in pool','woman in the pool','woman in water','fish woman','her','she'],
  wizard:  ['wizard','old man','old wizard','sage','sorcerer','man','him','he','wizard man','the wizard'],
  unicorn: ['unicorn','white horse','horse','white creature','white animal','white one','the unicorn'],
  frog:    ['frog','toad','green frog','little frog','jumping frog','prince','the prince','the frog'],
  sunny:   ['sunny','dog','yellow dog','big dog','beast','guard dog','the dog','puppy','animal'],
  woman:   ['woman','cook','woman of the tree','tree woman','keeper','lady',
            'woman at the hearth','the woman','mom','mother','her','she'],
};

function resolveNPC(str) {
  if (!str) return null;
  const s = str.toLowerCase().replace(/^(the|a|an)\s+/, '').trim();
  if (!s) return null;
  // Exact match first
  for (const [npc, aliases] of Object.entries(NPC_MAP)) {
    if (s === npc || aliases.includes(s)) return npc;
  }
  // Substring match: input contains an alias keyword
  for (const [npc, aliases] of Object.entries(NPC_MAP)) {
    if (aliases.some(a => s.includes(a))) return npc;
  }
  return null;
}

// Which single NPC is in the current room (if exactly one)
function roomNPC() {
  const present = [];
  if (G.room === 'grotto')        present.push('mermaid');

  if (G.room === 'songbird_nest') present.push('unicorn');

  if (G.room === 'cooking_grotto')present.push('woman');
  if (frogRoom() === G.room && !f('frogKissed')) present.push('frog');
  return present.length === 1 ? present[0] : null;
}

// Strip leading noise words from a target string
function sn(str) {
  return (str || '').replace(/^(at|the|a|an|my|this|that|some|up|those|these)\s+/gi,'')
                    .replace(/\s+(up|carefully|gently|slowly|quickly|again)$/i,'')
                    .trim();
}

    dripping_hall:   `From the west: drip, drip, drip — steady as a clock. From the east: quiet, almost entirely.`,
    dripping_passage:`The dripping is close and loud now, a steady rhythm against wet walls. Your footsteps echo oddly.`,
    blind_grotto:    `The waterfall fills the whole space — continuous and total. You can't hear anything else, including yourself think.`,
    fox_chamber:     `The remembered sound of foxes — scratch and settle, scratch and settle. Nothing moving now, but the echo remains in the earth.`,
    fox_tunnel:      `Just your own breathing, magnified by the close walls.`,
    old_den:         `Perfect silence. The deep kind. You are very far underground and very well hidden.`,
    bat_roost:       `A soft papery breathing — hundreds of small chests, rising and falling. The occasional squeak, almost too high to hear.`,
    stream_junction: `The stream runs steadily east. From the north, it's quieter. From the east, it grows.`,
    narrow_rill:     `A trickle, barely. Getting quieter the further north you go — not what you would expect.`,
    stream_head:     `The faintest seep and bubble of water coming up through rock. The deepest quiet in all the caverns.`,
    riddle_junction: `Two passages. From the <b>east</b>, a faint echo comes back — your own breathing, returning to you. The west passage gives back nothing.`,
    east_cave_mouth: `Open air and the ravine above — wind, water, the creak of the bridge. After the caverns, almost overwhelming.`,
    fortress_ground: `Wind through broken battlements. Far above, something snaps in the breeze — a flag, or an old banner.`,
    fortress_l1:     `Absolute silence. The kind that means the room is waiting. Something here is paying close attention.`,
    fortress_l2:     `A faint hum from the amber light — felt more in your chest than heard in your ears.`,
    fortress_l3:     `Wind through the arrow-slits. Otherwise: the heavy silence of stone that has held its breath for centuries.`,
    tower_top:       `Everything at once — wind, birds, water, the tree, the whole forest below. All of it, finally, together.`,
  };
  print(sounds[G.room] || `You listen. The forest breathes. Something, somewhere, is always moving.`, 'sys');
}

// Smart fallback — never say "I don't know what X is"
function smartFallback(raw) {
  const s = raw.toLowerCase();
  const room = ROOMS[G.room];

  // Check for direction words
  for (const d of ['northeast','northwest','southeast','southwest','north','south','east','west','up','down','behind','out','back']) {
    if (s.includes(d) && room && room.exits && room.exits[d]) {
      print(`(Heading ${d}.)`, 'sys');
      cmdGo(d); return;
    }
  }

  // Check for NPC words
  for (const [npc] of Object.entries(NPC_MAP)) {
    const aliases = NPC_MAP[npc];
    if (s.includes(npc) || aliases.some(a => s.includes(a))) {
      const npcHere = { mermaid: G.room==='grotto', wizard: G.room==='overlook',
        unicorn: G.room==='songbird_nest', sunny: G.room==='ravine',
        woman: G.room==='cooking_grotto', frog: frogRoom()===G.room && !f('frogKissed') };
      if (npcHere[npc]) { talkTo(npc); return; }
    }
  }

  // Check for item words and suggest action
  if (s.includes('mushroom') && MSPOT[G.room] === false) { cmdTake('mushroom'); return; }
  if (s.includes('key') && G.room === 'behind_falls' && !f('keyTaken')) { cmdTake('key'); return; }
  if (s.includes('torch') && G.room === 'cave_mouth' && !f('torchTaken')) { cmdTake('torch'); return; }
  if (s.includes('honey') && G.room === 'old_garden' && !f('honeyTaken')) { cmdTake('honey'); return; }
  if (s.includes('bunny') || s.includes('rabbit')) { cmdOpen('bunny'); return; }
  if (s.includes('telescope') || s.includes('scope')) { cmdLook('telescope'); return; }
  if (s.includes('flower') || s.includes('bloom')) { cmdLook('flower'); return; }
  if (s.includes('map') && has('basement_map')) { cmdRead('map'); return; }
  if (s.includes('dictionary') || s.includes('book')) { cmdLook('dictionary'); return; }
  if (s.includes('door') && G.room === 'fox_warren') {
    if (has('iron_key')) { cmdUse('key','door'); } else { cmdLook('door'); }
    return;
  }
  if ((s.includes('fire') || s.includes('hearth')) && G.room === 'cooking_grotto') { cmdLook('fire'); return; }

  print(`Hmm — not quite sure what you mean. Try <b>look</b> to see what's around you, or <b>help</b> for a list of things you can do.`, 'sys');
}

// ── Main parser ─────────────────────────────────────────────────

function parse(raw) {
  // Newt — only restart works
  if (f('isNewt')) {
    const inp2 = raw.trim().toLowerCase();
    if (['restart','new game','start over','reset','begin again'].includes(inp2)) {
      clearSave(); print(`<em>The forest fades...</em>`, 'sys'); setTimeout(() => location.reload(), 600);
    } else {
      print(`You are a newt. Your options are limited. (Type <b>restart</b> to begin again.)`, 'sys');
    }
    return;
  }

  // Restart / new game
  const inp = raw.trim().toLowerCase();
  if (['restart','new game','start over','reset','begin again'].includes(inp)) {
    G._restarting = true;
    clearSave();
    print(`<em>The forest fades...</em>`, 'sys');
    setTimeout(() => location.reload(), 600);
    return;
  }

  // Name prompt at start
  if (G.namePrompt) {
    const name = raw.trim();
    if (!name) { print(`(Please enter your name to begin.)`, 'sys'); return; }
    G.playerName = name.charAt(0).toUpperCase() + name.slice(1);
    G.namePrompt = false;
    if (loadGame(G.playerName)) {
      print(`<br>Welcome back, <span class="em">${G.playerName}</span>. Your adventure continues.<br>`, 'sys');
      setTimeout(() => printRoom(), 300);
    } else {
      print(`<br>Welcome, <span class="em">${G.playerName}</span>.<br>`, 'sys');
      setTimeout(() => {
        print(`You open your eyes.`);
        print(`The first thing you notice is the <em>wind</em>.`);
        print(``);
        setTimeout(() => { G.room = 'high_bough'; printRoom(); }, 400);
      }, 300);
    }
    return;
  }

  const input = raw.toLowerCase().trim();
  if (!input) return;

  print(`<span class="echo">&gt; ${raw}</span>`);

  const words = input.split(/\s+/);
  const verb  = words[0];
  const rest  = words.slice(1).join(' ');

  // ── Intercept bare Latin tower words ────────────────────────────
  // Only the Latin forms are intercepted; English ('say listen' etc.) goes through verb dispatch
  const latinToEnglish = { avsculta:'listen', ama:'love', disce:'learn' };
  if (latinToEnglish[input] !== undefined) {
    cmdSay(latinToEnglish[input]); return;
  }

  // ── Bare direction ───────────────────────────────────────────────
  const bareDir = resolveDir(input);
  if (bareDir) { cmdGo(bareDir); return; }

  // ── Verb dispatch ────────────────────────────────────────────────

  // MOVEMENT
  if (['go','move','walk','run','travel','head','proceed','advance',
       'enter','exit','leave','climb','descend','crawl','step',
       'continue','follow','pass','cross'].includes(verb)) {
    if (!rest) {
      print(`Which direction? Try <b>north</b>, <b>south</b>, <b>east</b>, <b>west</b>, <b>up</b>, <b>down</b>…`, 'sys'); return;
    }
    // strip leading prepositions before resolving
    const cleaned = rest.replace(/^(the|to|into|through|over|across|behind|past|up|down)\s+/,'').trim();
    const dir = resolveDir(cleaned) || resolveDir(rest);
    if (dir) { cmdGo(dir); return; }
    // "go to [room name]" — give a gentle hint
    print(`Not sure which way "${rest}" is. Try a direction like <b>north</b>, <b>south</b>, <b>up</b>, <b>behind</b>…`, 'sys');
    return;
  }

  // APPROACH — if NPC nearby, talk; else move
  if (['approach','interact','greet'].includes(verb)) {
    if (rest) {
      const npc = resolveNPC(sn(rest));
      if (npc) { talkTo(npc); return; }
      const dir = resolveDir(rest);
      if (dir) { cmdGo(dir); return; }
    }
    const nr = roomNPC();
    if (nr) { talkTo(nr); return; }
    print(`Approach what? There doesn't seem to be anyone here to approach.`, 'sys'); return;
  }

  // LOOK / EXAMINE / SEARCH
  if (['look','l','examine','x','inspect','check','describe',
       'study','peer','gaze','observe','survey','scan','search'].includes(verb)) {
    // "look through/in/at telescope" → telescope
    if (rest.match(/through|in|into/) && rest.match(/telescope|scope/)) { cmdLook('telescope'); return; }
    // "look out [window/view]" from high rooms
    if (rest.match(/^(out|outside|down|below|up|above|around|about)$/) || !rest) {
      cmdLook(rest || null); return;
    }
    cmdLook(sn(rest) || null); return;
  }

  // TAKE / PICK UP
  if (['take','get','grab','pick','collect','acquire','pocket',
       'snatch','retrieve','lift','carry','fetch'].includes(verb)) {
    const cleaned = sn(rest.replace(/\bup\b/g,' ').trim());
    cmdTake(cleaned || null); return;
  }

  // INVENTORY
  if (['inventory','i','inv','items','pockets','bag','carried'].includes(verb)
      || input.match(/^(what (do i|am i) (have|carry|carrying)|my (stuff|items|bag|pockets))$/)) {
    cmdInventory(); return;
  }

  // TALK / SPEAK (with target)
  if (['talk','ask','chat','address','converse'].includes(verb)) {
    const npcStr = sn(rest.replace(/^(to|with|at)\s+/,''));
    const npc = npcStr ? resolveNPC(npcStr) : roomNPC();
    if (!npc && !npcStr) {
      const nr = roomNPC();
      if (nr) { talkTo(nr); return; }
      print(`Talk to whom? There doesn't seem to be anyone here.`, 'sys'); return;
    }
    talkTo(npc || npcStr); return;
  }

  // SPEAK alone or "speak to X" — could be a direction to say a word
  if (verb === 'speak') {
    if (!rest || rest.match(/^(to|with|the|a|an)?\s*$/)) {
      const nr = roomNPC();
      if (nr) { talkTo(nr); return; }
      print(`Speak to whom? There doesn't seem to be anyone here.`, 'sys'); return;
    }
    const npcStr = sn(rest.replace(/^(to|with|at)\s+/,''));
    const npc = resolveNPC(npcStr);
    if (npc) { talkTo(npc); return; }
    // Otherwise treat as "say [word]"
    cmdSay(rest); return;
  }

  // GIVE / OFFER / HAND / SHOW
  if (['give','hand','offer','present','pass','share','show'].includes(verb)) {
    if (!rest) { print(`Give what to whom?`, 'sys'); return; }
    // "give X to Y"
    const toMatch = rest.match(/^(.+?)\s+to\s+(.+)$/);
    if (toMatch) { cmdGive(sn(toMatch[1]), sn(toMatch[2])); return; }
    // "give Y X" (npc first) or "give X" (auto-target)
    const parts = rest.split(/\s+/);
    const maybeNPC = resolveNPC(parts[0]);
    if (maybeNPC && parts.length > 1) { cmdGive(parts.slice(1).join(' '), parts[0]); return; }
    // "give X" — if only one NPC in room, target them
    const nr = roomNPC();
    if (nr) { cmdGive(sn(rest), nr); return; }
    // ambiguous
    const p = rest.split(' ');
    cmdGive(p.slice(1).join(' ') || p[0], p[0]); return;
  }

  // USE / TRY / APPLY
  if (['use','apply','activate','employ','utilize','attempt'].includes(verb)) {
    const onMatch = rest.match(/^(.+?)\s+(?:on|with|against|at)\s+(.+)$/);
    if (onMatch) { cmdUse(sn(onMatch[1]), sn(onMatch[2])); return; }
    cmdUse(sn(rest), ''); return;
  }
  if (verb === 'try') {
    const t = sn(rest);
    // "try the door" / "try door"
    if (['door','gate','lock','latch'].some(k => t.includes(k))) {
      if (has('iron_key') && G.room === 'fox_warren') { cmdUse('key','door'); }
      else if (G.room === 'fox_warren') { print(`The door is locked. You'd need the right key.`, 'sys'); }
      else { cmdLook('door'); }
      return;
    }
    const onMatch = rest.match(/^(.+?)\s+(?:on|with)\s+(.+)$/);
    if (onMatch) { cmdUse(sn(onMatch[1]), sn(onMatch[2])); return; }
    cmdUse(t, ''); return;
  }

  // OPEN / UNLOCK / CRACK
  if (['open','pry','crack','twist','unlock','undo','unscrew'].includes(verb)) {
    const t = sn(rest);
    if (['door','gate','lock','latch'].some(k => t.includes(k))) {
      if (has('iron_key') && G.room === 'fox_warren') { cmdUse('key','door'); }
      else if (G.room === 'fox_warren') { print(`The door is locked. You'd need the right key.`, 'sys'); }
      else { print(`There's no locked door here.`, 'sys'); }
      return;
    }
    cmdOpen(t); return;
  }

  // READ / DECIPHER
  if (['read','decipher','translate'].includes(verb)) {
    cmdRead(sn(rest)); return;
  }

  // LIGHT / IGNITE
  if (['light','ignite','kindle','spark','burn','torch'].includes(verb)) {
    const withMatch = rest.match(/^(.+?)\s+(?:with|using)\s+(.+)$/);
    cmdLight(withMatch ? sn(withMatch[1]) : sn(rest)); return;
  }
  if (verb === 'start' && rest.match(/fire|flame|hearth/)) { cmdLight('fire'); return; }
  if (verb === 'make' && rest.match(/fire|flame/)) { cmdLight('fire'); return; }

  // KISS / PECK / SMOOCH
  if (['kiss','smooch','peck'].includes(verb)) {
    const t = sn(rest) || (roomNPC() === 'frog' ? 'frog' : '');
    cmdKiss(t); return;
  }
  // "lean toward/in" → kiss if frog is present
  if ((verb === 'lean') && frogRoom() === G.room && !f('frogKissed')) {
    cmdKiss('frog'); return;
  }

  // SAY / SHOUT / CALL OUT / ANNOUNCE
  if (['say','shout','yell','whisper','utter','cry','announce',
       'recite','chant','proclaim','exclaim','declare','scream','murmur'].includes(verb)) {
    if (!rest) {
      if (G.room === 'riddle_junction') print(`Call out what? Say something — anything — and listen for an answer.`, 'sys');
      else print(`Say what?`, 'sys');
      return;
    }
    cmdSay(rest); return;
  }
  // "call out [word]"
  if (verb === 'call') {
    const trimmed = rest.replace(/^out\s*/,'').trim();
    if (trimmed) { cmdSay(trimmed); return; }
    if (G.room === 'riddle_junction') { print(`Call out something — the chamber is listening.`, 'sys'); }
    else { cmdSay(rest || ''); }
    return;
  }

  // SMELL / SNIFF / BREATHE
  if (['smell','sniff','breathe','inhale','sniff'].includes(verb)) {
    cmdSmell(sn(rest)); return;
  }

  // LISTEN
  if (verb === 'listen') { cmdListen(rest); return; }

  // FEEL / TOUCH / PET / STROKE
  if (['feel','touch','pat','stroke','rub','pet','scratch','poke','caress'].includes(verb)) {
    const t = sn(rest);
    // Bare touch — no target
    if (!t) {
      print(`You reach out and touch the world around you. The forest is very real.`, 'sys'); return;
    }
    const npc = resolveNPC(t);
    if (npc === 'sunny' && G.room === 'ravine') {
      if (f('sunnyCalmed')) { print(`Sunny's fur is warm and soft. She thumps her tail twice.`); }
      else { print(`Sunny fixes you with a look that suggests this is not the right moment.`); }
      return;
    }
    if (npc === 'frog' && frogRoom() === G.room && !f('frogKissed')) {
      if (G.frogIdx === FROG_PATH.length - 1) { cmdKiss('frog'); }
      else { G.frogIdx++; print(`You reach toward the frog. He blinks once — and launches off in a tremendous leap.`); }
      return;
    }
    if (npc === 'unicorn' && G.room === 'songbird_nest') {
      print(`The unicorn steps back slightly. She is patient, not tame.`); return;
    }
    if (npc === 'wizard' && G.room === 'overlook') {
      print(`The wizard opens one eye. You think better of it.`); return;
    }
    if (npc === 'mermaid' && G.room === 'grotto') {
      print(`You reach toward the pool — but she has already slipped beneath the surface, leaving only ripples.`); return;
    }
    if (npc === 'woman' && G.room === 'cooking_grotto') {
      print(`She gives you a warm sideways hug without putting down her spoon.`); return;
    }
    // Pool in mossy_chamber
    if (G.room === 'mossy_chamber' && ['pool','water','reflection','surface'].some(k => t.includes(k))) {
      print(`You reach down and touch the surface of the pool. The ripple spreads outward — but your reflection doesn't ripple with it. It stays perfectly still, watching you, for just a moment too long.`); return;
    }
    // Bark / trunk in great_hollow
    if (G.room === 'great_hollow' && ['bark','tree','trunk','wall','wood','hollow'].some(k => t.includes(k))) {
      print(`You press your palm flat against the bark. There is a deep, slow vibration beneath it — almost too low to feel. The tree is breathing.`); return;
    }
    // Crystals in overlook
    if (G.room === 'overlook' && ['crystal','crystals','chime','chimes','string','strings'].some(k => t.includes(k))) {
      print(`You set the crystals swinging. Tiny rainbows scatter across every surface — the walls, the floor, your hands, the wizard's silver braid.`);
      print(`The wizard doesn't open his eyes. But the corner of his mouth moves.`); return;
    }
    // Stones / scrolls / figures / dried flowers in overlook
    if (G.room === 'overlook' && ['stone','stones','rock','rocks','pebble','pebbles'].some(k => t.includes(k))) {
      print(`You pick up the warm stone. It is inexplicably warm in your hand — not from sitting in sunlight, just warm, as if it has been warm a very long time. You put it back exactly where it was.`); return;
    }
    if (G.room === 'overlook' && ['scroll','scrolls','bark','writing'].some(k => t.includes(k))) {
      print(`The bark-scroll is surprisingly smooth. The tiny writing shifts slightly as you hold it — or seems to. You set it back carefully.`); return;
    }
    if (G.room === 'overlook' && ['figure','figures','carving','carvings','carved'].some(k => t.includes(k))) {
      aggravateWizard(); return;
    }
    if (G.room === 'overlook' && ['flower','flowers','dried flower','dried flowers'].some(k => t.includes(k))) {
      aggravateWizard(); return;
    }
    // Vines / flowers in high_bough
    if (G.room === 'high_bough' && ['vine','vines','flower','flowers','petal','petals'].some(k => t.includes(k))) {
      print(`You brush your fingers through the vines overhead. A small shower of pale pink petals breaks loose, spinning slowly in the high wind, drifting down and down into the green far below.`); return;
    }
    // Mushrooms in mushroom_ring
    if (G.room === 'mushroom_ring' && ['mushroom','mushrooms'].some(k => t.includes(k))) {
      print(`You press a palm against the amber mushroom. It pulses — once, twice — brightening under your hand. The others dim slightly in response, then slowly return, as if answering.`); return;
    }
    // Fungi in fungi_nook
    if (G.room === 'fungi_nook' && ['mushroom','mushrooms','fungi','fungus'].some(k => t.includes(k))) {
      print(`You touch one of the glowing fungi. It shivers, its color shifting from violet to deep green and back. The others respond in a slow wave — light traveling around the chamber and fading into the dark.`); return;
    }
    // Pool in grotto
    if (G.room === 'grotto' && ['pool','water','surface'].some(k => t.includes(k))) {
      if (f('mermaidTalked')) {
        print(`Your fingers break the surface. The water is shockingly cold. Below, the mermaid's face appears — looking up at you with patient, amused eyes. Then she's gone.`);
      } else {
        print(`Your fingers break the surface. The water is shockingly cold. For a moment, something stirs below — a flash of silver — then nothing.`);
      }
      return;
    }
    // Waterfall in behind_falls
    if (G.room === 'behind_falls' && ['waterfall','water','falls','curtain'].some(k => t.includes(k))) {
      print(`You push your hand into the curtain of falling water. Cold — a solid, roaring cold. You pull back immediately, hand dripping, ears ringing.`); return;
    }
    // Stream water in cavern stream rooms
    if (['stream','water','rill','current'].some(k => t.includes(k)) &&
        ['stream_cave','stream_junction','narrow_rill','stream_head'].includes(G.room)) {
      if (G.room === 'stream_head') {
        print(`You press your hand to the seeping rock. The water comes through cold and very slow — one drop at a time, then a trickle, then gone. The stone is smooth from years of it.`);
      } else {
        print(`You dip your hand into the stream. The water is bitterly cold — colder than it should be this deep — and fast, rushing over your fingers and away into the dark.`);
      }
      return;
    }
    print(`You don't find anything like that here to touch.`, 'sys'); return;
  }

  // WAIT / REST / SIT
  if (['wait','z','rest','sit','pause','stand','idle','stay','stop'].includes(verb)) {
    print(`Time passes. The forest doesn't mind.`, 'sys'); return;
  }

  // HELP
  if (['help','hints','commands','tutorial'].includes(verb) || input === '?') {
    cmdHelp(); return;
  }
  if (input.match(/^(what can i do|how do i play|how does this work|what do i do)/)) {
    cmdHelp(); return;
  }

  // PLEASANTRIES
  if (input.match(/^(thanks|thank you|thank|please|sorry|excuse me|hello|hi|hey|good morning|good day)$/)) {
    print(`The forest accepts your courtesy with a gentle rustle of leaves.`, 'sys'); return;
  }

  // YES / NO
  if (['yes','no','okay','ok','nope','yep','yeah','sure','maybe'].includes(input)) {
    print(`(Not sure what you're responding to — what would you like to do?)`, 'sys'); return;
  }

  // EAT / DRINK
  if (['eat','drink','taste','bite','chew','swallow','consume','lick'].includes(verb)) {
    if (sn(rest).includes('mushroom')) { print(`You're not sure about eating random mushrooms from a magic forest. Better save them.`, 'sys'); }
    else if (sn(rest).includes('honey')) { print(`The honey is meant for someone else — for now.`, 'sys'); }
    else { print(`Eating things at random seems unwise in an enchanted forest.`, 'sys'); }
    return;
  }

  // PUSH / PULL / MOVE OBJECT
  if (['push','pull','drag','shove','slide','move'].includes(verb) && rest) {
    if (sn(rest).includes('stone') && G.room.startsWith('fortress')) {
      print(`It is very heavy and very deliberate. It seems to be waiting for something other than brute force.`, 'sys');
    } else {
      print(`You give it your best try. Nothing budges.`, 'sys');
    }
    return;
  }

  // BREAK / ATTACK / FIGHT
  if (['break','smash','destroy','shatter','hit','attack','fight','punch','kick','stab',
       'kill','murder','slay','harm','hurt','wound'].includes(verb)) {
    const target = sn(rest);
    const npc = target ? resolveNPC(target) : null;
    if (npc === 'frog') {
      print(`You look at the frog. The frog looks at you.`);
      print(`You cannot do it. You simply cannot. He has golden eyes and a great deal of dignity.`); return;
    }
    if (npc === 'unicorn') { print(`Absolutely not.`, 'sys'); return; }
    if (npc === 'sunny') { print(`You would never. Sunny would also never forgive you, and frankly, neither would you.`, 'sys'); return; }
    if (npc === 'mermaid' || npc === 'wizard' || npc === 'woman') {
      print(`This forest doesn't call for that kind of thing.`, 'sys'); return;
    }
    print(`This forest doesn't call for that kind of thing.`, 'sys'); return;
  }

  // JUMP
  if (['jump','leap','hop','bounce'].includes(verb)) {
    if (G.room === 'high_bough') { print(`You look down at the forest floor, very far below. You decide not to.`, 'sys'); }
    else { print(`You jump on the spot. Nothing helpful happens.`, 'sys'); }
    return;
  }

  // KNOCK
  if (verb === 'knock') {
    if (G.room === 'fox_warren') { print(`You knock on the iron-banded door. It does not answer.`, 'sys'); }
    else { print(`There's nothing here worth knocking on.`, 'sys'); }
    return;
  }

  // WEAR / PUT ON
  if (['wear','equip','don','put'].includes(verb) ||
      (verb === 'put' && rest.match(/^on\b/))) {
    const t = sn(rest.replace(/^on\b\s*/,'')).toLowerCase();
    if (!t || ['crown','tiny crown','golden crown','gold crown'].some(k => t.includes(k))) {
      if (!has('tiny_crown')) { print(`You don't have a crown to wear.`, 'sys'); return; }
      if (f('crownWorn')) { print(`You're already wearing it — on your finger, where it fits best.`, 'sys'); return; }
      sf('crownWorn');
      print(`You slide the tiny golden crown onto your finger. It fits perfectly.`);
      print(`You feel, if anything, slightly more dignified than before.`);
    } else {
      print(`You can't wear that.`, 'sys');
    }
    return;
  }

  // REMOVE / TAKE OFF crown
  if (['remove','unequip','doff'].includes(verb) ||
      (verb === 'take' && rest.match(/^off\b/))) {
    const t = sn(rest.replace(/^off\b\s*/,'')).toLowerCase();
    if (!t || ['crown','tiny crown','golden crown'].some(k => t.includes(k))) {
      if (!f('crownWorn')) { print(`You're not wearing the crown right now.`, 'sys'); return; }
      G.flags.crownWorn = false;
      print(`You slide the crown off your finger and tuck it safely into your pocket.`, 'sys');
    } else {
      print(`You're not wearing that.`, 'sys');
    }
    return;
  }

  // DROP / THROW
  if (['drop','leave','discard','throw','toss','put down'].includes(verb)) {
    print(`Better keep hold of everything you've found.`, 'sys'); return;
  }

  // CLIMB alone (no direction) — context
  if (verb === 'climb' && !rest) {
    if (ROOMS[G.room] && ROOMS[G.room].exits) {
      if (ROOMS[G.room].exits.up) { cmdGo('up'); return; }
      if (ROOMS[G.room].exits.down) { cmdGo('down'); return; }
    }
    print(`There's nothing particular to climb here.`, 'sys'); return;
  }

  // AGAIN
  if (['again','g','repeat','redo'].includes(verb)) {
    print(`(Type your action again.)`, 'sys'); return;
  }

  // ── Last resort: try to identify any word in the input ──────────
  // Bare NPC name or NPC word anywhere in input
  const bareNPC = resolveNPC(input) || resolveNPC(verb);
  if (bareNPC) {
    const isHere = {
      mermaid: G.room==='grotto', wizard: G.room==='overlook',
      unicorn: G.room==='songbird_nest', sunny: G.room==='ravine',
      woman: G.room==='cooking_grotto', frog: frogRoom()===G.room,
    }[bareNPC];
    if (isHere) { talkTo(bareNPC); return; }
    const npcNames = { mermaid:'The mermaid', wizard:'The wizard', unicorn:'The unicorn',
                       frog:'The frog', sunny:'Sunny', woman:'The Woman of the Tree' };
    print(`${npcNames[bareNPC] || 'They'} ${bareNPC==='frog'&&f('frogKissed') ? 'became a prince and is gone' : 'isn\'t here right now'}.`, 'sys');
    return;
  }

  // Bare item word in input → try to examine or take it
  const itemWords = {
    mushroom: () => MSPOT[G.room]===false ? cmdTake('mushroom') : cmdLook('mushroom'),
    key:      () => !f('keyTaken') && G.room==='behind_falls' ? cmdTake('key') : cmdLook('key'),
    flower:   () => cmdLook('flower'),
    torch:    () => !f('torchTaken') && G.room==='cave_mouth' ? cmdTake('torch') : cmdLook('torch'),
    honey:    () => !f('honeyTaken') && G.room==='old_garden' ? cmdTake('honey') : cmdLook('honey'),
    bunny:    () => cmdOpen('bunny'),
    map:      () => cmdRead('map'),
    dictionary:() => cmdRead('dictionary'),
    telescope: () => cmdLook('telescope'),
    telescope: () => cmdLook('telescope'),
    door:     () => cmdLook('door'),
    fire:     () => cmdLook('fire'),
    hearth:   () => cmdLook('fire'),
  };
  for (const [word, action] of Object.entries(itemWords)) {
    if (input.includes(word)) { action(); return; }
  }

  // If nothing matched — smart fallback
  smartFallback(raw);
}

// ── Output ─────────────────────────────────────────────────────
const outputEl = document.getElementById('output');

function print(html, cls) {
  const p = document.createElement('p');
  if (cls) p.className = cls;
  p.innerHTML = (html === '' || html === undefined) ? '&nbsp;' : html;
  outputEl.appendChild(p);
  outputEl.scrollTop = outputEl.scrollHeight;
}

function printRoom() {
  const room = ROOMS[G.room];
  if (!room) return;
  print(`<span class="room-title">${room.name}</span>`);
  print(``);
  const desc = room.desc ? room.desc() : '';
  desc.split(/\n\n+/).forEach(para => { if (para.trim()) print(para.trim()); });
  print(`<span class="sep">─────────────────────────────────────</span>`);
}

// ── Input ──────────────────────────────────────────────────────
const cmdEl = document.getElementById('cmd');
cmdEl.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    const val = this.value.trim();
    this.value = '';
    if (val) { parse(val); if (!G._restarting) saveGame(); }
  }
});

// ── Start ──────────────────────────────────────────────────────
window.addEventListener('load', () => {
  print(`<span class="win" style="font-size:1.5em; letter-spacing:0.08em">✦ &nbsp; THE GREAT TREE &nbsp; ✦</span>`);
  print(``);
  print(`<em>A birthday adventure</em>`);
  print(``);

  print(`Before we begin —`);
  print(`What is your name?`);
  cmdEl.focus();
});
</script>
